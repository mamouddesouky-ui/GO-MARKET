<style>

<div class="gt"><button class="btn ${up?'g':''}" data-gm="in">تسجيل دخول</button><button class="btn ${up?'':'g'}" data-gm="up">حساب جديد</button></div>
${up?'<label>الاسم</label><input id="gn" autocomplete="name">':''}<label>${up?'رقم الموبايل':'رقم الموبايل أو اسم الدخول'}</label><input id="gp" type="text" dir="ltr" autocapitalize="none" autocorrect="off" spellcheck="false" autocomplete="username" placeholder="${up?'01xxxxxxxxx':'01xxxxxxxxx أو اسم الدخول'}"><label>كلمة المرور (6 أحرف أو أكتر)</label><input id="gw" type="password" autocomplete="${up?'new-password':'current-password'}">
<div id="gerr" style="color:#dc2626;font-size:13px;margin-top:8px;min-height:18px"></div><button class="btn" data-gsub style="margin-top:6px">${up?'إنشاء الحساب':'دخول'}</button>${up?'':'<button class="btn g" data-gwa style="margin-top:10px;width:100%">💬 نسيت كلمة المرور؟ كلّم المطعم على واتساب</button>'}</div>`}
const SU='@staff.shahey.app';
const gEmail=v=>{v=v.trim();if(v.includes('@'))return v.toLowerCase();const p=v.replace(/[\s-]/g,'').replace(/^\+?20/,'0');if(/^01[0125]\d{8}$/.test(p))return p+PH;return/^[a-z0-9._-]{3,30}$/i.test(v)?v.toLowerCase()+SU:null};
function cbar(){const e=$('custBar'),u=FB&&FB.au&&FB.au.currentUser;if(role!=='customer'||!u){e.style.display='none';return}const m=u.email.endsWith(PH);e.style.display='flex';e.innerHTML=`<span>👤 ${esc(u.displayName||'')} ${m?esc(u.email.split('@')[0]):''}</span><button data-logout>تسجيل خروج</button>`}
async function gateGo(){const er=$('gerr'),e=gEmail($('gp').value),pw=$('gw').value,up=gm==='up',n=up?$('gn').value.trim():'';er.textContent='';
 if(!e||(up&&!e.endsWith(PH)))return er.textContent=up?'اكتب رقم موبايل صحيح (01xxxxxxxxx)':'اكتب رقم موبايل صحيح أو اسم الدخول';if(pw.length<6)return er.textContent='كلمة المرور 6 أحرف على الأقل';if(up&&n.length<2)return er.textContent='اكتب اسمك';
 const b=document.querySelector('[data-gsub]');b.disabled=true;try{sessionStorage.setItem('sh_os','1')}catch(x){}
 try{if(up){const cr=await FB.u.createUserWithEmailAndPassword(FB.au,e,pw);await FB.u.updateProfile(cr.user,{displayName:n});LS.set('sh_cust',{...LS.get('sh_cust',{}),n,p:e.endsWith(PH)?e.split('@')[0]:''});cbar()}else await FB.u.signInWithEmailAndPassword(FB.au,e,pw)}
 catch(x){b.disabled=false;er.textContent=({'auth/email-already-in-use':'الرقم ده مسجّل قبل كده، سجّل دخول','auth/invalid-credential':'بيانات الدخول أو كلمة المرور غلط','auth/operation-not-allowed':'فعّل Email/Password من Firebase','auth/too-many-requests':'محاولات كتير، استنى شوية','auth/network-request-failed':'مفيش اتصال بالإنترنت'})[x.code]||'تعذر: '+(x.code||'خطأ')}}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.gm){gm=b.dataset.gm;gateDraw()}else if(b.dataset.gsub!==undefined)gateGo();else if(b.dataset.gwa!==undefined){const ph=String(S().phone||'').replace(/\D/g,'');if(!ph||ph==='201000000000')return toast('رقم المطعم لسه ما اتضبطش');const me=($('gp')||{value:''}).value.trim();open('https://wa.me/'+ph+'?text='+encodeURIComponent('أنا نسيت كلمة المرور بتاعة حسابي'+(me?' (رقم الموبايل: '+me+')':'')+'، ممكن مساعدة؟'),'_blank')}});
// ---- عناوين محفوظة ----
const ADS=()=>LS.get('sh_addrs',[]);
function adsHtml(){const L=ADS();return L.length?`<label>عناويني المحفوظة</label><div style="display:flex;gap:6px;flex-wrap:wrap">${L.map((a,i)=>`<span style="display:inline-flex;background:#efe6de;border-radius:10px"><button type="button" class="sm" data-adu="${i}">📍 ${esc(a.n)}</button><button type="button" class="sm" style="background:none" data-adx="${i}" aria-label="حذف العنوان">✕</button></span>`).join('')}</div>`:''}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset,L=ADS();
 if(d.adchg!==undefined){$('aed').hidden=false;$('asv').hidden=true}
 else if(d.adu!==undefined){const a=L[+d.adu];if(!a)return;$('ca').value=a.a||'';ord.loc=a.loc?{lat:a.loc[0],lng:a.loc[1],acc:0}:null;gpsStat();toast('تم اختيار عنوان '+a.n)}
 else if(d.adsave!==undefined){const a=$('ca').value.trim();if(a.length<6&&!ord.loc)return toast('اكتب العنوان أو حدد موقعك الأول');const n=(prompt('اسم العنوان (مثال: البيت، الشغل)')||'').trim();if(!n)return;
  const N=L.filter(x=>x.n!==n);N.unshift({n,a,loc:ord.loc?[ord.loc.lat,ord.loc.lng]:null});LS.set('sh_addrs',N.slice(0,5));$('adl').innerHTML=adsHtml();toast('تم حفظ عنوان '+n+' ✅')}
 else if(d.adx!==undefined){L.splice(+d.adx,1);LS.set('sh_addrs',L);$('adl').innerHTML=adsHtml()}});
// ---- كوبونات متعددة ----
const cpExpired=k=>!!k.exp&&new Date(k.exp+'T23:59:59')<new Date();
const coupons=()=>[...(S().promoCode&&+S().promoPct>0?[{code:S().promoCode,pct:+S().promoPct}]:[]),...(S().coupons||[]).filter(k=>k.on!==false)];
function cpTab(){const L=S().coupons||[];return `<h3 style="margin-top:18px;font-size:16px">الكوبونات</h3><div class="two"><div><label>الكود</label><input id="kc" autocomplete="off"></div><div><label>الخصم %</label><input id="kp" type="number" inputmode="decimal"></div></div><div class="two"><div><label>ينتهي في (اختياري)</label><input id="kx" type="date"></div><div><label>أقل قيمة طلب (اختياري)</label><input id="km" type="number" inputmode="decimal"></div></div><button class="btn" data-kadd>＋ إضافة كوبون</button><div style="margin-top:8px">`+L.map((k,i)=>`<div class="row"><div class="m"><b>${esc(k.code)} • ${esc(k.pct)}%</b><span>${k.exp?(cpExpired(k)?'منتهي • ':'ينتهي ')+esc(k.exp):'بدون تاريخ انتهاء'}${k.min?' • من '+money(k.min):''}${k.on===false?' • متوقف':''}</span></div><button class="sm" data-ktog="${i}">${k.on===false?'تفعيل':'إيقاف'}</button><button class="sm r" data-kdel="${i}">حذف</button></div>`).join('')+'</div>'}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset,L=(S().coupons||[]).slice(),done=()=>{S().coupons=L;persist('set');openOwner('bn')};
 if(d.kadd!==undefined){const code=$('kc').value.trim().toUpperCase(),pct=parseFloat($('kp').value);if(code.length<3)return toast('اكتب كود 3 أحرف على الأقل');if(!(pct>0&&pct<=100))return toast('نسبة الخصم من 1 لـ 100');if(L.some(k=>k.code===code)||String(S().promoCode).toUpperCase()===code)return toast('الكود موجود بالفعل');L.push({code,pct,exp:$('kx').value||'',min:parseFloat($('km').value)||0,on:true});done();toast('تمت إضافة الكوبون ✅')}
 else if(d.ktog!==undefined){L[+d.ktog].on=L[+d.ktog].on===false;done()}
 else if(d.kdel!==undefined){L.splice(+d.kdel,1);done()}});
// ---- بانر العروض ----
function bnTab(){const L=S().banners||[];return `<div class="note">صور العروض بتظهر أعلى الصفحة وبتتبدل لوحدها. الأفضل صورة عرضية (مثلاً 900×400). حد أقصى 5 صور.</div><label>عنوان العرض (اختياري)</label><input id="bt" maxlength="40"><label>القسم اللي يفتحه العرض (اختياري)</label><select id="bl"><option value="">بدون</option>${CATS.slice(1).map(c=>`<option value="${c[0]}">${c[2]} ${c[1]}</option>`).join('')}</select><label>اختر صورة لإضافة العرض</label><input id="bf" type="file" accept="image/*"><div style="margin-top:10px">`+L.map((b,i)=>`<div class="row"><div class="th"><img src="${b.img}" alt=""></div><div class="m"><b>${esc(b.t||'عرض '+(i+1))}</b></div><button class="sm r" data-bdel="${i}">حذف</button></div>`).join('')+'</div>'+cpTab()}
document.addEventListener('change',async e=>{if(e.target.id!=='bf'||!e.target.files[0])return;const L=(S().banners||[]).slice();if(L.length>=5){toast('الحد الأقصى 5 عروض');return}
 try{const img=await compress(e.target.files[0],900);L.push({img,t:$('bt').value.trim(),l:$('bl').value});S().banners=L;persist('set');render();openOwner('bn');toast('تمت إضافة العرض ✅')}catch(x){toast('تعذر قراءة الصورة')}});
document.addEventListener('click',e=>{const b=e.target.closest('[data-bdel]');if(!b)return;const L=(S().banners||[]).slice();L.splice(+b.dataset.bdel,1);S().banners=L;persist('set');render();openOwner('bn')});
// ---- إدارة الأقسام ----
const catList=()=>CATS.slice(1).map(c=>({id:c[0],n:c[1],e:c[2]}));
function catsTab(){return`<div class="note">الأقسام اللي بتظهر للزبائن. القسم بيظهر في الشريط بس لما يبقى فيه صنف.</div><div class="two"><div><label>أيموجي</label><input id="ce" maxlength="2" placeholder="🛒"></div><div><label>اسم القسم</label><input id="cn"></div></div><button class="btn" data-cadd>＋ إضافة قسم</button><div style="margin-top:10px">`+catList().map(c=>`<div class="row"><div class="th">${esc(c.e)}</div><div class="m"><b>${esc(c.n)}</b><span>${data.items.filter(i=>i.cat===c.id).length} صنف</span></div><button class="sm" data-cren="${c.id}">تعديل</button><button class="sm" data-cdel="${c.id}">حذف</button></div>`).join('')+'</div>'}
async function saveCats(l){setC(l);LS.set('sh_cats',l);if(FB)await FB.m.setDoc(FB.m.doc(FB.db,'config','cats'),{list:l}).catch(e=>toast('تعذر الحفظ: '+(e.code||'خطأ')));render();openOwner('cats')}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset,L=catList();
 if(d.cadd!==undefined){const n=$('cn').value.trim(),em=$('ce').value.trim()||'🏷';if(n.length<2)return toast('اكتب اسم القسم');if(L.some(c=>c.n===n))return toast('القسم موجود بالفعل');L.push({id:'c'+Date.now().toString(36),n,e:em});saveCats(L)}
 else if(d.cdel){const k=data.items.filter(i=>i.cat===d.cdel).length;if(k)return toast('القسم فيه '+k+' صنف، انقلهم أو احذفهم الأول');if(confirm('حذف القسم؟'))saveCats(L.filter(c=>c.id!==d.cdel))}
 else if(d.cren){const c=L.find(x=>x.id===d.cren),n=prompt('اسم القسم',c.n);if(n&&n.trim().length>1){c.n=n.trim();const em=prompt('الأيموجي',c.e);if(em&&em.trim())c.e=em.trim();saveCats(L)}}});
// ---- events ----
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;const d=t.dataset;
 if(d.ot)setType(d.ot);else if(d.myords!==undefined)openOrders();else if(d.share){const o=ordList.find(x=>x.id===d.share);if(o){const tx=drvMsg(plOf(o)).replace(/\*/g,'');if(navigator.share)navigator.share({text:tx}).catch(()=>{});else{navigator.clipboard&&navigator.clipboard.writeText(tx);toast('تم نسخ الطلب')}}}else if(d.st){const[id,k]=d.st.split('|'),{db,m}=FB;m.updateDoc(m.doc(db,'orders',id),{status:k}).catch(()=>toast('تعذر تحديث الطلب'))}else if(d.as){const[id,v]=d.as.split('|'),x=DR().find(q=>q.id==v),{db,m}=FB;if(x)m.updateDoc(m.doc(db,'orders',id),{drv:{id:x.id,n:x.name,p:x.phone}}).catch(()=>toast('تعذر تعيين المندوب'))}else if(d.login!==undefined)doLogin();else if(d.logout!==undefined)askLogout();else if(d.xyes!==undefined)doLogout();else if(d.seed!==undefined)seedFb();else if(d.dadd!==undefined)addDrv();else if(d.dtog)drvToggle(d.dtog);else if(d.ddel)drvDel(d.ddel);else if(d.dst){const[id,k]=d.dst.split('|');FB.m.updateDoc(FB.m.doc(FB.db,'orders',id),{status:k}).catch(()=>toast('تعذر تحديث الحالة'))}else if(d.pushon!==undefined)enablePush();else if(d.pushc)pushCust(d.pushc);else if(d.fav){const id=+d.fav;favs=favs.includes(id)?favs.filter(x=>x!==id):[...favs,id];LS.set('sh_fav',favs);if(!favs.length&&cat==='fav')cat='all';render()}else if(d.re)reorder(d.re);else if(d.xok){const ix=[...document.querySelectorAll('#xl input:checked')].map(x=>x.value);closeM();setQty(d.xok+(ix.length?'~'+ix.join('.'):''),1);toast('أضيفت للسلة')}else if(d.gps!==undefined)getGPS();else if(d.promo!==undefined)applyPromo();else if(d.cat){cat=d.cat;render()}else if(d.add){const it=data.items.find(x=>x.id==d.add);if(it&&it.opts&&it.opts.length)openExtras(it.id);else{setQty(String(d.add),1);toast('أضيفت للسلة')}}
 else if(d.q)setQty(d.q,+d.d);else if(d.checkout!==undefined)openCheckout();
 else if(d.pin!==undefined)checkPin();else if(d.tab)openOwner(d.tab);else if(d.edit!==undefined)itemForm(+d.edit||0);
 else if(d.tog){const i=data.items.find(x=>x.id==d.tog);i.on=!i.on;persist('item',i);render();openOwner('items')}
 else if(d.del){if(confirm('حذف هذه الوجبة نهائياً؟')){data.items=data.items.filter(i=>i.id!=d.del);delete cart[d.del];persist('del',d.del);render();openOwner('items')}}
 else if(d.saveset!==undefined)saveSet();else if(d.exp!==undefined)expFile();else if(d.imp!==undefined)$('fi').click();
 else if(d.reset!==undefined){if(confirm('سيتم مسح تعديلاتك على هذا الجهاز. متابعة؟')){LS.del('sh_data');location.reload()}}});
document.addEventListener('submit',e=>{if(e.target.id==='ckf'){e.preventDefault();sendOrder()}});
$('cartBtn').onclick=openCart;$('ordBtn').onclick=openOrders;let lo=isOpen();setInterval(()=>{const o=isOpen();if(o!==lo){lo=o;render()}},60000);$('barBtn').onclick=openCart;$('q').oninput=render;
function showUpdate(w){if($('upd'))return;const b=document.createElement('div');b.id='upd';b.style.cssText='position:fixed;top:0;left:0;right:0;z-index:100;background:#15803d;color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px;font-weight:700';
 b.innerHTML='<span>🔄 يوجد تحديث جديد للتطبيق</span><button style="background:#fff;color:#15803d;border-radius:10px;padding:7px 14px;font-weight:800">تحديث الآن</button>';
 b.querySelector('button').onclick=e=>{e.target.textContent='جاري التحديث...';w.postMessage('SKIP')};document.body.appendChild(b)}
if('serviceWorker' in navigator){const hadCtl=!!navigator.serviceWorker.controller;let rl=false;
 navigator.serviceWorker.addEventListener('controllerchange',()=>{if(rl||!hadCtl)return;rl=true;location.reload()});
 addEventListener('load',()=>navigator.serviceWorker.register('sw.js').then(r=>{
  if(r.waiting&&hadCtl)showUpdate(r.waiting);
  r.addEventListener('updatefound',()=>{const n=r.installing;n.addEventListener('statechange',()=>{if(n.state==='installed'&&navigator.serviceWorker.controller)showUpdate(n)})});
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)r.update().catch(()=>{})});
 }).catch(()=>{}));}
boot();
</script>
