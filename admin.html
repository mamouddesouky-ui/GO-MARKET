<style>

button,select,input,textarea{font:inherit;color:inherit}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--bd);border-radius:10px;background:var(--card)}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
.b{background:var(--br);color:#fff;border:0;border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:700}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.st b{display:block;font-size:24px;color:var(--br)}.st span{color:var(--mu);font-size:13px}

.bar i{display:block;background:var(--br);border-radius:6px 6px 0 0;min-height:2px;margin-bottom:4px}
.tb{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.tb>*{flex:1;min-width:130px}
table{width:100%;border-collapse:collapse}td,th{padding:8px 6px;border-bottom:1px solid var(--bd);text-align:right;font-size:14px;vertical-align:middle}
td input[type=number]{width:90px;padding:6px}.th{width:40px;height:40px;border-radius:8px;background:var(--bg);display:grid;place-items:center;overflow:hidden}.th img{width:100%;height:100%;object-fit:cover}
.bd{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:700;background:#e5e7eb;color:#111}
.s-new{background:#fee2e2;color:#991b1b}.s-preparing{background:#fef3c7;color:#92400e}.s-delivering{background:#dbeafe;color:#1e40af}.s-done{background:#dcfce7;color:#166534}

#m .card{width:100%;max-width:520px}#t{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 18px;border-radius:99px;opacity:0;transition:.2s;z-index:30;pointer-events:none}#t.on{opacity:1}
.lg{max-width:360px;margin:12vh auto;padding:16px}.er{color:var(--rd);font-size:13px;margin-top:8px}.mu{color:var(--mu);font-size:13px}

 <div class="card"><b>مبيعات آخر 7 أيام</b><div class="bar" style="margin-top:12px">${days.map(d=>`<div><i style="height:${Math.round(d.v/mx*90)}px"></i>${d.l}<br>${num(d.v)}</div>`).join('')}</div></div>
 <div class="card"><b>الأكثر طلباً هذا الأسبوع</b>${top.map(t=>`<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--bd)"><span>${esc(t[0])}</span><b>${num(t[1])}</b></div>`).join('')||'<div class="mu">لا توجد بيانات بعد</div>'}</div>

 else if(d.on)run(F.updateDoc(dref('items',d.on),{on:t.checked}),'تم');
 else if(d.st)run(F.updateDoc(dref('orders',d.st),{status:t.value}),'تم تحديث الحالة ✅');
 else if(d.dv&&t.value){const x=drivers.find(v=>v.id===t.value);run(F.updateDoc(dref('orders',d.dv),{drv:{id:x.id,n:x.name,p:x.phone}}),'تم تعيين المندوب ✅')}});
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
 if(d.tab){tab=d.tab;draw(1)}else if(d.edit)form(d.edit);
 else if(d.a==='cadd'){const n=$('#cn').value.trim(),em=$('#ce').value.trim()||'🏷';if(n.length<2)return toast('اكتب اسم القسم');if(CL.some(c=>c.n===n))return toast('القسم موجود');saveC([...CL,{id:'c'+Date.now().toString(36),n,e:em}])}
 else if(d.cdel){const k=items.filter(i=>i.cat===d.cdel).length;if(k)return toast('القسم فيه '+k+' صنف، انقلهم أو احذفهم الأول');if(confirm('حذف القسم؟'))saveC(CL.filter(c=>c.id!==d.cdel))}
 else if(d.cren){const c=CL.find(x=>x.id===d.cren),n=prompt('اسم القسم',c.n);if(n&&n.trim().length>1){const em=prompt('الأيموجي',c.e);saveC(CL.map(x=>x.id===c.id?{...x,n:n.trim(),e:(em&&em.trim())||x.e}:x))}}else if(d.dtog){const x=drivers.find(v=>v.id===d.dtog);run(F.updateDoc(dref('drivers',d.dtog),{on:!x.on}))}
 else if(d.ddel){if(confirm('حذف المندوب؟'))run(F.deleteDoc(dref('drivers',d.ddel)),'تم الحذف')}
 else if(d.a==='login')doLogin();else if(d.a==='out')U.signOut(au);else if(d.a==='new')form(0);else if(d.a==='close')$('#m').classList.remove('on');
 else if(d.a==='fsave'){const o=form.get();if(o){await run(F.setDoc(dref('items',o.id),o),'تم الحفظ ✅');$('#m').classList.remove('on')}}
 else if(d.a==='fdel'){if(confirm('حذف الصنف؟')){await run(F.deleteDoc(dref('items',form.id)),'تم الحذف');$('#m').classList.remove('on')}}
 else if(d.a==='bulk'){const c=$('#fc').value,L=items.filter(i=>c==='all'||i.cat===c),v=parseFloat(prompt('نسبة التغيير % على '+L.length+' صنف (10 للزيادة، -5 للتخفيض)'));if(!L.length||!isFinite(v)||!confirm('تغيير '+L.length+' صنف بنسبة '+v+'%؟'))return;const w=F.writeBatch(db);L.forEach(i=>w.update(dref('items',i.id),{price:Math.max(0,Math.round(i.price*(1+v/100)))}));run(w.commit(),'تم تعديل الأسعار ✅')}
 else if(d.a==='save'){const o={};FLD.forEach(f=>{const v=$('#s_'+f[0]).value.trim();o[f[0]]=f[2]==='number'?Math.max(0,parseFloat(v)||0):v});CHK.forEach(c=>o[c[0]]=$('#s_'+c[0]).checked);o.phone=String(o.phone).replace(/\D/g,'');run(F.setDoc(F.doc(db,'config','settings'),o,{merge:true}),'تم حفظ الإعدادات ✅')}
 else if(d.a==='dadd'){const n=$('#dn').value.trim(),p=$('#dp').value.trim(),em=$('#de').value.trim(),pw=$('#dw').value;if(n.length<2||!/^\S+@\S+\.\S+$/.test(em)||pw.length<6)return toast('اكتب الاسم وإيميل صحيح وكلمة مرور 6+');
  let s2;try{s2=A.initializeApp(C,'s'+Date.now());const a2=U.getAuth(s2),cr=await U.createUserWithEmailAndPassword(a2,em,pw);await U.signOut(a2);await F.setDoc(dref('drivers',cr.user.uid),{name:n,phone:p,email:em,on:true});toast('تمت إضافة المندوب ✅');draw(1)}catch(x){toast(x.code==='auth/email-already-in-use'?'الإيميل مستخدم':'تعذر: '+(x.code||'خطأ'))}finally{if(s2)A.deleteApp(s2).catch(()=>{})}}});
</script></body></html>
