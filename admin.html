<style>

button,select,input,textarea{font:inherit;color:inherit}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--bd);border-radius:10px;background:var(--card)}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
.b{background:var(--br);color:#fff;border:0;border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:700}

.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}

.st b{display:block;font-size:24px;color:var(--br)}.st span{color:var(--mu);font-size:13px}

.oh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:14px 14px 10px}
.on_{display:inline-block;background:var(--bg);border-radius:8px;padding:2px 9px;font-weight:800;font-size:13px;color:var(--br);margin-inline-end:6px}
.oh h4{margin:0;font-size:16px}.oh .mu{margin-top:4px}
.bd.s-cancelled{background:#e5e7eb;color:#4b5563}
.ob{padding:0 14px 12px;display:grid;gap:10px}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:12px;font-weight:700;background:var(--bg);border-radius:8px;padding:4px 9px;color:var(--tx)}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.acts a{flex:1;min-width:90px;text-align:center;text-decoration:none;font-size:13px;font-weight:700;padding:8px 10px;border-radius:10px;border:1px solid var(--bd);color:var(--tx);background:var(--card)}

.nt{display:flex;gap:8px;font-size:14px;background:#fef9c3;color:#713f12;border-radius:10px;padding:9px 11px;border:1px dashed #facc15}
.ln{border:1px solid var(--bd);border-radius:12px;overflow:hidden}
.ln div{display:flex;align-items:center;gap:10px;padding:8px 11px;font-size:14px}.ln div+div{border-top:1px solid var(--bd)}
.ln b.q{min-width:32px;text-align:center;background:var(--br);color:#fff;border-radius:8px;padding:1px 6px;font-size:13px}
.ln span{flex:1}
.sm_{background:var(--bg);border-radius:12px;padding:10px 12px;font-size:14px}
.sm_ div{display:flex;justify-content:space-between;padding:2px 0}.sm_ .tt{border-top:1px dashed var(--bd);margin-top:5px;padding-top:7px;font-size:17px;font-weight:800;color:var(--br)}
.sm_ .ds{color:var(--gr)}
.of{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px 14px;background:var(--bg);border-top:1px solid var(--bd)}
.of .full{grid-column:1/-1}
.nx{background:var(--br);color:#fff;border:0;border-radius:10px;padding:11px;font-weight:800;font-size:14px;cursor:pointer}
.nx.dn{background:var(--gr)}
.dvb{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:#1e40af;background:#dbeafe;border-radius:10px;padding:7px 11px}
@media(max-width:420px){.ords{grid-template-columns:1fr}}
.ln .fl{background:#f0fdf4;border:1.5px dashed #fb923c;border-radius:10px;font-weight:700;white-space:pre-line}</style></head><body><div id="app"></div><div id="m"></div><div id="t"></div>
