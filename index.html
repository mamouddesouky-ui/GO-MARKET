function compress(file,mx=700,sq){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{if(sq){const sd=Math.round(Math.min(mx,Math.max(im.width,im.height))),c=document.createElement('canvas');c.width=c.height=sd;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,sd,sd);const k=Math.min(1,sd*.9/Math.max(im.width,im.height)),w=im.width*k,h=im.height*k;URL.revokeObjectURL(u);x.drawImage(im,(sd-w)/2,(sd-h)/2,w,h);return res(c.toDataURL('image/jpeg',.72))}const k=Math.min(1,mx/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));const x=c.getContext('2d');URL.revokeObjectURL(u);x.drawImage(im,0,0,c.width,c.height);
 if(file.type==='image/jpeg')return res(c.toDataURL('image/jpeg',.7));
 let o=c.toDataURL('image/webp',.82);
 if(o.indexOf('data:image/webp')!==0){x.globalCompositeOperation='destination-over';x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);o=c.toDataURL('image/jpeg',.7)}
 res(o)};im.onerror=rej;im.src=u})}
