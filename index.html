<style>

#splash .ring{position:relative;width:150px;height:150px;display:grid;place-items:center}
#splash .ring::before{content:'';position:absolute;inset:0;border-radius:50%;border:4px solid rgba(255,255,255,.22);border-top-color:#fff;animation:spSpin 1.2s linear infinite}

  if(!/^(\+?20|0)?1[0125]\d{8}$/.test(p))return err.textContent='رقم الموبايل غير صحيح';
  const L=cr?[]:cartLines(),c=calc();
  const no = FB ? (ord.no || (ord.no = +String(Date.now()).slice(-5) + Math.floor(Math.random() * 900 + 100))) : (LS.get('sh_ord', 1000) + 1);
  const dc={no,status:'new',type:ord.type,n,p,a,l:L.map(x=>({n:x.it.name,q:x.q})),sub:c.sub,disc:c.disc,fee:c.fee,total:c.total,createdAt:FB.m.serverTimestamp()};
  const oid=crypto.randomUUID?crypto.randomUUID().replace(/-/g,''):Date.now()+Math.random().toString(36).slice(2,12);
  if(FB) await fbSend(oid,dc);
  cart={};LS.set('sh_cart',cart);closeM();render();toast('تم إرسال طلبك بنجاح ✅');
}

async function fbSend(id,doc){
  const {db,m}=FB, r=m.doc(db,'orders',id), to=ms=>new Promise((_,j)=>setTimeout(()=>j({code:'timeout'}),ms));
  fbSend.err='';
  try {
    await Promise.race([m.setDoc(r,doc), to(15000)]);
    return true;
  } catch(e) {
    fbSend.err = (e && e.code) || String((e && e.message) || e).slice(0,50);
    try {
      const x = await m.getDoc(r);
      if (x.exists() && x.metadata.hasPendingWrites) {
        toast('هيتم إرسال طلبك أول ما يتوفر اتصال ✅');
        return true;
      }
    } catch(_) {}
    return false;
  }
}

function compress(file, mx=700, sq){
  return new Promise((res, rej) => {
    const u = URL.createObjectURL(file), im = new Image();
    im.onload = () => {
      const c = document.createElement('canvas');
      let w = im.width, h = im.height;
      const k = Math.min(1, mx / Math.max(w, h));
      c.width = Math.max(1, Math.round(w * k));
      c.height = Math.max(1, Math.round(h * k));
      const x = c.getContext('2d');
      URL.revokeObjectURL(u);
      
      if(sq){
        const sd = Math.round(Math.min(mx, Math.max(w, h)));
        c.width = c.height = sd;
        x.fillStyle = '#fff'; x.fillRect(0, 0, sd, sd);
        const k2 = Math.min(1, sd * .9 / Math.max(w, h));
        x.drawImage(im, (sd - w * k2) / 2, (sd - h * k2) / 2, w * k2, h * k2);
      } else {
        x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height);
        x.drawImage(im, 0, 0, c.width, c.height);
      }
      
      let quality = 0.75;
      let dataUrl = c.toDataURL('image/jpeg', quality);
      while(dataUrl.length > 106000 && quality > 0.2) {
        quality -= 0.1;
        dataUrl = c.toDataURL('image/jpeg', quality);
      }
      res(dataUrl);
    };
    im.onerror = rej;
    im.src = u;
  });
}

async function initFb(){
  try{
    const B='https://www.gstatic.com/firebasejs/10.14.1/';
    const[a,f,u,ac]=await Promise.all([
      import(B+'firebase-app.js'),
      import(B+'firebase-firestore.js'),
      import(B+'firebase-auth.js'),
      import(B+'firebase-app-check.js')
    ]);
    const app=a.initializeApp(FB_CONFIG);
    try {
      ac.initializeAppCheck(app, {
        provider: new ac.ReCaptchaV3Provider('YOUR_RECAPTCHA_SITE_KEY'),
        isTokenAutoRefreshEnabled: true
      });
    } catch(e){}
    let db;
    try{db=f.initializeFirestore(app,{localCache:f.persistentLocalCache(),experimentalAutoDetectLongPolling:true})}catch(e){db=f.getFirestore(app)}
    FB={app,a,db,m:f,au:u.getAuth(app),u};
    const t0=Date.now();
    const e=$('splash');if(e){setTimeout(()=>{e.classList.add('out');setTimeout(()=>e.remove(),600)},Math.max(0,1500-(Date.now()-t0)))}
    return true;
  }catch(e){FB=null;return false}
}

document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;const d=b.dataset;
  if(d.add){setQty(String(d.add),1);toast('أضيفت للسلة')}
  else if(d.q)setQty(d.q,+d.d);
});

boot();
